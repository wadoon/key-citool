name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
        key: [ "3.0.0", "3.1.0-SNAPSHOT" ]
              # Binary incompatible "2.12.x"
              # Version not on Maven Central: "2.10.0"
        os:  [ ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    permissions:
      contents: read
      code-quality: write
    steps:
      # Check out the PR head commit (not the merge commit) so coverage line
      # numbers map correctly to the diff.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build & test
        run: ./gradlew check
        env:
          KEY_VERSION: ${{ matrix.key }}

      # Generates the JaCoCo report and converts it to Cobertura XML
      # (build/reports/jacoco/test/cobertura-jacocoTestReport.xml).
      - name: Generate code coverage report
        run: ./gradlew jacocoTestReport

      # Upload coverage once (coverage is identical across the matrix), so
      # GitHub's code quality bot can comment on pull requests.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.key == '3.0.0'
        uses: actions/upload-code-coverage@v1
        with:
          file: build/reports/jacoco/test/cobertura-jacocoTestReport.xml
          language: Java
          label: code-coverage/jacoco

      - uses: actions/upload-artifact@v7
        with:
          name: Reports-${{ matrix.os }}-${{ matrix.key }}
          path: build/reports
